name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate MyAnimeList Card
        run: |
          python3 scripts/generate_mal_svg.py

      - name: Generate Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: xconkhi9x
          template: classic
          base: ""
          config_timezone: Asia/Saigon
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: none
          filename: github-metrics.svg

      - name: Commit & Push changes
        run: |
          sudo cp -f /metrics_renders/github-metrics.svg ./github-metrics.svg || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg myanimelist.svg
          git commit -m "chore: update metrics & myanimelist activity" || exit 0
          git pull --rebase origin main || true
          git push
